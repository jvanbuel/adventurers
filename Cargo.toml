[package]
name = "adventurers"
version = "1.22.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust port of Open Adventure, Eric S. Raymond's forward port of Colossal Cave Adventure 2.5 (430-point version)"
license = "BSD-2-Clause"
readme = "README.md"
default-run = "advent"

[lib]
name = "adventurers"
path = "src/lib.rs"

[[bin]]
name = "advent"
path = "src/bin/advent/main.rs"

[[bin]]
name = "cheat"
path = "src/bin/cheat.rs"

[features]
default = []
# Disable save/resume entirely (equivalent of -DADVENT_NOSAVE).
nosave = []
# Automatic save/restore via -a (equivalent of -DADVENT_AUTOSAVE).
autosave = []

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[build-dependencies]
serde_yaml = "0.9"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
