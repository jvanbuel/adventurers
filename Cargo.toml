[package]
name = "adventurers"
version = "1.22.0"
edition = "2021"
description = "A Rust port of Open Adventure, Eric S. Raymond's forward port of Colossal Cave Adventure 2.5 (430-point version)"
license = "BSD-2-Clause"
readme = "README.md"
build = "build.rs"
default-run = "advent"

[lib]
name = "adventurers"
path = "src/lib.rs"

[[bin]]
name = "advent"
path = "src/main.rs"

[[bin]]
name = "cheat"
path = "src/bin/cheat.rs"

[features]
default = []
# Disable save/resume entirely (equivalent of -DADVENT_NOSAVE).
nosave = []
# Automatic save/restore via -a (equivalent of -DADVENT_AUTOSAVE).
autosave = []

[build-dependencies]
serde_yaml = "0.9"

[profile.release]
opt-level = 2
